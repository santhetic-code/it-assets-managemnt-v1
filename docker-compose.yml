services:
  db:
    image: postgres:16-alpine
    container_name: itam_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itam_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itam_backend
    restart: unless-stopped
    env_file: .env
    # Tidak mengekspos port ke host publik, hanya diakses dari jaringan internal Docker di port 8001
    expose:
      - "8001"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itam_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itam_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - itam_net
    command: reflex run --env dev --frontend-port 3000 --backend-port 8000 --backend-host 0.0.0.0

networks:
  itam_net:
    driver: bridge

volumes:
  postgres_data:
