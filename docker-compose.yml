services:
  db:
    image: postgres:16-alpine
    container_name: itam_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itam_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itam_backend
    restart: unless-stopped
    env_file: .env
    # Tidak mengekspos port ke host publik, hanya diakses dari jaringan internal Docker di port 8001
    expose:
      - "8001"
    volumes:
      - ./backend:/app
      - ./docs/data:/app/docs/data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itam_net
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itam_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./frontend:/app
      - frontend_web:/app/.web
      - frontend_states:/app/.states
      - frontend_bun_cache:/root/.bun
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itam_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null && curl -fsS http://localhost:8000/ping >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    command: reflex run --env dev --frontend-port 3000 --backend-port 8000 --backend-host 0.0.0.0

networks:
  itam_net:
    driver: bridge

volumes:
  postgres_data:
  frontend_web:
  frontend_states:
  frontend_bun_cache:
